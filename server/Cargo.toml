[package]
name = "nimrag-server"
version = "0.1.0"
edition.workspace = true
rust-version = "1.89" # std File::try_lock; core stays at the workspace 1.80
license.workspace = true
publish.workspace = true
description = "nimrag ingest server: content-addressed file store plus a rebuildable SQLite view"

[lib]
name = "nimrag_server"
path = "src/lib.rs"

[[bin]]
name = "nimrag-server"
path = "src/main.rs"

[dependencies]
nimrag-core = { path = "../core" }
anyhow = "1.0.104"
zip = { version = "=9.6.1", default-features = false, features = ["deflate"] }
axum = "0.8.9"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
http-body-util = "0.1.5"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
