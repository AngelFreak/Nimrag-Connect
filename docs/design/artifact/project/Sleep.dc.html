<span style="font-size: 13px; color: #9AA7AC">Night of Wed 18 Nov</span>
</div>

</section>
<section style="background: #171E22; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA7AC">Lowest HR</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">48 bpm</span>
</section>
<section style="background: #171E22; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #9AA7AC">Breathing</span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">13.4 /min</span>
</section>
</div>
<section style="background: #171E22; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">

<span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
</div>
