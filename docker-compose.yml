# nimrag-server with the web app built in. `docker compose up -d --build`, then set the owner
# password: `docker compose exec -T server nimrag-server user set-password < pwfile`.
# Serve it over HTTPS (a reverse proxy or the tailnet): login cookies are Secure.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: nimrag
    volumes:
      # Named volume (not a bind mount) so the non-root user inside owns /data.
      - nimrag_data:/data
    ports:
      # Local access only; put a TLS proxy in front for phones and browsers.
      - "127.0.0.1:8096:8080"
    restart: unless-stopped

volumes:
  nimrag_data:
